<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG 控制台</title>
    <script>
      (function(){
        var LS_KEY='paicoding_ai_token';
        var orig=window.fetch;
        window.fetch=function(url,opts){
          opts=opts||{};
          var t=localStorage.getItem(LS_KEY);
          if(t){opts.headers=Object.assign({},opts.headers||{}, {'Authorization':'Bearer '+t});}
          return orig.call(this,url,opts).then(function(resp){
            if(resp.status===401 || resp.status===403){
              // 未登录/无权限 → 引导到总控台登录
              if(location.pathname.indexOf('/admin/console')<0){
                location.href='/admin/console';
              }
            }
            return resp;
          });
        };
      })();
    </script>
    <style>
        :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:#18212f;background:#f5f7fb}
        *{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:0 auto;padding:32px 22px 60px}
        .top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #dfe5ee;padding-bottom:22px;margin-bottom:24px}
        h1{margin:0;font-size:30px;letter-spacing:0}.sub{color:#64748b;margin-top:8px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
        section{background:#fff;border:1px solid #dfe5ee;border-radius:8px;padding:22px;box-shadow:0 4px 18px #27364a0d}h2{margin:0 0 16px;font-size:18px}
        .provider{border:1px solid #e4e9f1;border-radius:8px;padding:16px;margin-top:12px}.provider.active{border-color:#2563eb;box-shadow:0 0 0 2px #2563eb16}
        .row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.label{display:block;color:#64748b;font-size:12px;margin:12px 0 6px}
        input,select{width:100%;border:1px solid #cfd8e5;border-radius:6px;padding:10px;font:inherit;background:#fff}button{border:0;border-radius:6px;padding:10px 14px;background:#2563eb;color:#fff;font:inherit;cursor:pointer}button.secondary{background:#e8eef8;color:#24415f}button:disabled{opacity:.55;cursor:wait}
        .status{font-size:13px;margin-top:12px;color:#64748b;min-height:20px}.status.ok{color:#14804a}.status.error{color:#b42318}.hint{font-size:12px;color:#64748b;line-height:1.6;background:#f7f9fc;border-left:3px solid #94a3b8;padding:10px 12px;margin-bottom:16px}
        .file{border:1px dashed #b6c3d5;border-radius:8px;padding:16px}.file input{border:0;padding:0}.docs{margin-top:18px}.doc{padding:12px 0;border-bottom:1px solid #edf0f5;font-size:13px}.doc:last-child{border-bottom:0}.pill{display:inline-block;border-radius:99px;background:#e9f1ff;color:#1d4ed8;padding:3px 8px;font-size:11px;margin-left:6px}
        @media(max-width:820px){.grid{grid-template-columns:1fr}.top{display:block}.top button{margin-top:16px}}
    </style>
</head>
<body>
<main class="shell">
    <header class="top">
        <div><h1>RAG 控制台</h1><div class="sub">模型路由、图片理解和知识库上传</div></div>
        <button class="secondary" onclick="location.href='/ai-chat.html'">返回聊天</button>
    </header>
    <div class="grid">
        <section>
            <h2>LLM Provider</h2>
            <div class="hint">当前聊天模型按请求动态读取。MIMO 用于多模态图片和表格理解，DeepSeek 可作为文本模型备用。API Key 只保存密文，页面不会回显明文。</div>
            <div id="providers">加载中...</div>
            <div class="row" style="margin-top:18px"><select id="active"></select><button onclick="saveProviders()">保存并切换</button></div>
            <div id="modelStatus" class="status"></div>
        </section>
        <section>
            <h2>知识库上传</h2>
            <div class="hint">上传后会进入现有解析、父子 Chunk、Embedding 和 ES 混合召回链路。先执行数据库迁移，再上传 PDF、DOCX、TXT 或 Excel。</div>
            <label class="label">知识库</label><select id="kbId"><option value="1">加载中...</option></select>
            <label class="label">用户 ID</label><input id="userId" value="0">
            <label class="label">文件</label><div class="file"><input id="file" type="file" accept=".pdf,.docx,.txt,.md,.markdown,.html,.xlsx,.xls,.png,.jpg,.jpeg,.bmp,.webp"></div>
            <button style="margin-top:16px" onclick="uploadKnowledge()">上传并开始解析</button>
            <div id="uploadStatus" class="status"></div>
            <div class="docs"><strong>处理说明</strong><div class="doc">文本层 PDF：保留页码后切成 child Chunk</div><div class="doc">扫描 PDF：LiteParse + OCR（配置后启用）</div><div class="doc">表格：表头和行组用于召回，结构化数据后续用于查询</div></div>
        </section>
    </div>
</main>
<script>
let providers=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadProviders(){const r=await fetch('/admin/api/providers');const j=await r.json();providers=j.data||[];renderProviders();loadBases()}
function renderProviders(){document.getElementById('providers').innerHTML=providers.map((p,i)=>`<div class="provider ${p.active?'active':''}"><div class="row"><strong>${esc(p.displayName)}</strong><span class="pill">${esc(p.providerCode)}</span><label style="text-align:right"><input style="width:auto" type="checkbox" data-enabled="${i}" ${p.enabled?'checked':''}> 启用</label></div><label class="label">OpenAI-compatible Base URL</label><input data-url="${i}" value="${esc(p.apiBaseUrl)}"><label class="label">模型</label><input data-model="${i}" value="${esc(p.model)}"><label class="label">新 API Key</label><input data-key="${i}" type="password" placeholder="留空保留当前密钥"><div style="margin-top:12px"><button class="secondary" onclick="testProvider(${i})">测试连接</button></div></div>`).join('');document.getElementById('active').innerHTML=providers.map(p=>`<option value="${esc(p.providerCode)}" ${p.active?'selected':''}>激活：${esc(p.displayName)}</option>`).join('')}
async function saveProviders(){const payload={activeProvider:document.getElementById('active').value,providers:providers.map((p,i)=>({provider:p.providerCode,apiBaseUrl:document.querySelector(`[data-url="${i}"]`).value,model:document.querySelector(`[data-model="${i}"]`).value,apiKey:document.querySelector(`[data-key="${i}"]`).value,enabled:document.querySelector(`[data-enabled="${i}"]`).checked}))};const r=await fetch('/admin/api/providers',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();show('modelStatus',j.success?'模型配置已保存，下一次请求生效':j.message,j.success);if(j.success){providers=j.data;renderProviders()}}
async function testProvider(i){const p=providers[i];const body={provider:p.providerCode,apiBaseUrl:document.querySelector(`[data-url="${i}"]`).value,model:document.querySelector(`[data-model="${i}"]`).value,apiKey:document.querySelector(`[data-key="${i}"]`).value};const r=await fetch('/admin/api/providers/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();show('modelStatus',j.data?.message||j.message,j.data?.success)}
async function uploadKnowledge(){const file=document.getElementById('file').files[0];if(!file){show('uploadStatus','请选择文件',false);return}const fd=new FormData();fd.append('file',file);fd.append('kbId',document.getElementById('kbId').value);fd.append('userId',document.getElementById('userId').value);const r=await fetch('/admin/api/knowledge/upload',{method:'POST',body:fd});const j=await r.json();show('uploadStatus',j.success?'上传成功，文档正在解析':j.message,j.success)}
async function loadBases(){const userId=document.getElementById('userId').value||'0';const r=await fetch('/admin/api/knowledge/bases?userId='+encodeURIComponent(userId));const j=await r.json();const select=document.getElementById('kbId');const bases=j.data||[];select.innerHTML=bases.length?bases.map(b=>`<option value="${b.id}">${esc(b.name)} (#${b.id})</option>`).join(''):'<option value="">暂无可用知识库</option>'}
document.getElementById('userId').addEventListener('change',loadBases);
function show(id,text,ok){const e=document.getElementById(id);e.textContent=text||'';e.className='status '+(ok?'ok':'error')}
loadProviders().catch(e=>show('modelStatus','加载模型配置失败：'+e.message,false));
</script>
</body>
</html>
