server:
  port: ${APP_PORT:8081}
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: paicoding-ai

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/paicoding_ai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}

ai:
  session:
    title: "HELLO, 我是AI助手"
    describe: "我是由技术派倾力打造的智能助理，我能推荐教程、答疑解惑，还能为您激发创意、畅聊心事。"
    examples:
      - "能帮我推荐一个合适的教程吗？"
      - "最近有什么热门文章？"
      - "如何入门Java编程？"
      - "Java和Python有什么区别？"
      - "Spring Boot怎么学？"

  system:
    chat: "你是技术派(paicoding)论坛的AI助手，你的名字叫技术派。你是由技术派团队基于大语言模型打造的智能助理。你的任务是帮助用户解答技术问题、推荐教程文章、提供编程建议。请始终用中文回答，回答要简洁清晰、有帮助。"
