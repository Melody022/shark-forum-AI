server:
  port: ${APP_PORT:8081}
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: paicoding-ai

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/pai_coding?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}

  ai:
    openai:
      base-url: ${AI_BASE_URL:${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}}
      api-key: ${AI_API_KEY:${MIMO_API_KEY:}}
      chat:
        options:
          model: ${AI_MODEL:${MIMO_MODEL:mimo-v2.5}}
        memory:
          redis:
            enabled: true
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${DASHSCOPE_API_KEY:}
        options:
          model: text-embedding-v4

    # MCP配置（Model Context Protocol）
    mcp:
      enabled: true  # 启用MCP
      servers:
        local-tools:
          type: local
          tools:
            - search
            - getCurrentTime
            - calculate

  # Spring Cloud Nacos - 服务注册与发现（用于Feign调用paicoding）
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: true  # 启用服务发现

ai:
  session:
    title: "HELLO, 我是AI助手"
    describe: "我是由技术派倾力打造的智能助理，我能推荐教程、答疑解惑，还能为您激发创意、畅聊心事。"
    examples:
      - "能帮我推荐一个合适的教程吗？"
      - "最近有什么热门文章？"
      - "如何入门Java编程？"
      - "Java和Python有什么区别？"
      - "Spring Boot怎么学？"

  memory:
    # Token预算管理配置
    token-budget:
      context-window: 1048576                 # DeepSeek 1M
      reserved-for-system: 1000               # 系统提示词预留
      reserved-for-tools: 2000                # 工具定义预留
      reserved-for-response: 4000             # 回复预留
      compression-threshold: 0.9              # 90%触发压缩

    # 压缩器配置
    compressor:
      retain-recent-rounds: 3                 # 保留最近3轮
      chunk-size: 5                           # Map阶段每片5条
      max-tool-result-chars: 500              # 工具结果最大字符

    # Redis存储配置
    redis:
      key-prefix: "chat:memory:"              # 会话记忆键前缀
      lock-prefix: "chat:lock:"               # 分布式锁键前缀
      token-prefix: "token:count:"            # Token统计键前缀
      expire-days: 7                          # 过期天数
      lock-timeout: 30000                     # 锁超时时间（毫秒）

  nacos:
    server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}
    group: PAICODING_AI_PROMPT

# paicoding提示词配置（用于SystemPromptConfig读取）
paicoding:
  ai:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:}
      group: PAICODING_AI_PROMPT

# RAG 解析、切片和向量索引配置
rag:
  embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
  chunk:
    parent-max-chars: ${RAG_PARENT_MAX_CHARS:6000}
    child-max-chars: ${RAG_CHILD_MAX_CHARS:1800}
    child-overlap-chars: ${RAG_CHILD_OVERLAP_CHARS:240}

# 当前聊天默认使用 MIMO 多模态模型；Embedding 仍由独立配置管理。
mimo:
  api:
    base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
    model: ${MIMO_MODEL:mimo-v2.5}
    key: ${MIMO_API_KEY:}

model-provider:
  security:
    secret-key: ${MODEL_PROVIDER_SECRET_KEY:dev-only-change-me}

deepseek:
  api:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    key: ${DEEPSEEK_API_KEY:${AI_API_KEY:}}

admin:
  rag:
    token: ${ADMIN_RAG_TOKEN:}
