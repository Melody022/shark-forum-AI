    category: "错误分类"

  # 通用对话相关的错误路由
  - userInput: "推荐文章"
    wrongSkill: "general-chat"
    correctSkill: "hot-article"
    reason: "推荐文章应该路由到文章相关，而不是通用对话"
    category: "错误分类"

  - userInput: "什么是Java"
    wrongSkill: "general-chat"
    correctSkill: "concept-explanation"
    reason: "概念解释应该路由到知识问答，而不是通用对话"
    category: "错误分类"

  # 语义模糊的边界case
  - userInput: "Java怎么学"
    wrongSkill: "article-recommend"
    correctSkill: "technical-qa"
    reason: "虽然涉及学习，但'怎么学'是技术问题，应该路由到知识问答"
    category: "边界case"

  - userInput: "Spring Boot教程推荐"
    wrongSkill: "article-recommend"
    correctSkill: "recommend-course"
    reason: "明确提到'教程'，应该路由到教程相关"
    category: "边界case"

  - userInput: "有没有好的Java学习资源"
    wrongSkill: "article-search"
    correctSkill: "recommend-course"
    reason: "'学习资源'包括教程和课程，优先路由到教程相关"
    category: "边界case"

  # 复杂语义的case
  - userInput: "Spring Boot和Spring Cloud有什么区别"
