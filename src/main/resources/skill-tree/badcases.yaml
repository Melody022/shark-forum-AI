# Badcase配置
# 明确Skill的适用边界，避免错误路由

badcases:
  # 文章相关的错误路由
  - userInput: "推荐教程"
    wrongSkill: "article-recommend"
    correctSkill: "course-recommend"
    reason: "推荐教程应该路由到教程相关，而不是文章相关"
    category: "错误分类"

  - userInput: "学习路线"
    wrongSkill: "article-recommend"
    correctSkill: "learning-path"
    reason: "学习路线应该路由到教程相关，而不是文章相关"
    category: "错误分类"

  - userInput: "什么是面向对象"
    wrongSkill: "article-recommend"
    correctSkill: "concept-explanation"
    reason: "概念解释应该路由到知识问答，而不是文章相关"
    category: "错误分类"

  # 教程相关的错误路由
  - userInput: "推荐文章"
